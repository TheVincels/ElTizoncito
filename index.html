<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Taquería El Tizoncito | Zacatepec, Mor.</title>
  <style>
    :root {
      --bg-obsidian: #07080c;
      --bg-midnight: #0c1426;
      --card-bg: #10141f;
      --border-subtle: rgba(255, 255, 255, 0.10);
      --accent-amber: #f59e0b;
      --accent-orange: #ea580c;
      --accent-blue: #2563eb;
      --whatsapp-green: #16a34a;
      --whatsapp-dark: #14532d;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 50% 0%, var(--bg-midnight) 0%, var(--bg-obsidian) 65%);
      background-color: var(--bg-obsidian);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 105px;
    }

    .app-shell {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 14px;
    }

    /* HEADER */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0 10px;
      gap: 8px;
    }

    .status-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 6px 10px;
      font-size: 11px;
      line-height: 1.35;
      color: #cbd5e1;
      flex-shrink: 0;
    }

    .status-pill strong {
      display: block;
      color: #f8fafc;
      font-weight: 600;
    }

    .status-dot {
      color: #22c55e;
      font-weight: 600;
    }

    .brand-logo {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      max-height: 54px;
    }

    .brand-logo img {
      max-height: 54px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.7));
    }

    .brand-fallback {
      text-align: center;
      font-weight: 800;
      color: #facc15;
      font-size: 15px;
      line-height: 1.1;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
    }

    .header-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
    }

    .badge-count {
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--accent-orange);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      min-width: 17px;
      height: 17px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }

    /* HERO PROMOCIÓN DEL DÍA */
    .hero-promo {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      height: 175px;
      margin: 6px 0 14px;
      background: #0b0f19;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
    }

    .hero-promo img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: right center;
      opacity: 0.72;
    }

    /* Viñeta oscura en todos los bordes */
    .hero-promo::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(7, 8, 12, 0.94) 0%, rgba(7, 8, 12, 0.68) 52%, rgba(7, 8, 12, 0.25) 100%),
        radial-gradient(circle at center, transparent 48%, rgba(7, 8, 12, 0.88) 100%);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      padding: 18px 20px;
    }

    .hero-tag {
      font-size: 10px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: #e2c799;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .hero-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .hero-sub {
      font-size: 15px;
      color: #e2e8f0;
      font-weight: 400;
    }

    /* CATEGORÍAS */
    .categories-wrap {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      scrollbar-width: none;
    }

    .categories-wrap::-webkit-scrollbar {
      display: none;
    }

    .cat-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cat-pill.active {
      background: rgba(37, 99, 235, 0.15);
      border-color: #f59e0b;
      box-shadow: 0 0 12px rgba(37, 99, 235, 0.35);
      color: #fbbf24;
      font-weight: 600;
    }

    .section-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.18), transparent);
      margin-bottom: 14px;
    }

    /* GRID 2 PRODUCTOS POR FILA */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .product-card {
      position: relative;
      height: 205px;
      border-radius: 18px;
      overflow: hidden;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      transition: transform 0.15s ease;
    }

    .product-card:active {
      transform: scale(0.98);
    }

    .product-card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    /* Viñeta oscura abajo para integrar texto y precio sin recortes */
    .product-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(7, 8, 12, 0.05) 32%, rgba(7, 8, 12, 0.78) 66%, rgba(7, 8, 12, 0.97) 100%),
        radial-gradient(circle at center, transparent 58%, rgba(7, 8, 12, 0.55) 100%);
      pointer-events: none;
    }

    .card-overlay {
      position: relative;
      z-index: 2;
      padding: 12px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 6px;
    }

    .card-info {
      min-width: 0;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .card-price {
      font-size: 14px;
      font-weight: 600;
      color: #e2e8f0;
    }

    .add-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(245, 158, 11, 0.55);
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(4px);
      color: #fbbf24;
      font-size: 20px;
      font-weight: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .add-btn:active {
      background: var(--accent-amber);
      color: #07080c;
    }

    /* BARRA INFERIOR FLOTANTE WHATSAPP */
    .bottom-bar-wrap {
      position: fixed;
      bottom: 14px;
      left: 0;
      right: 0;
      padding: 0 14px;
      z-index: 30;
    }

    .bottom-bar {
      max-width: 452px;
      margin: 0 auto;
      background: rgba(13, 18, 30, 0.92);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      padding: 6px 6px 6px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.75);
    }

    .cart-summary {
      font-size: 13px;
      color: #e2e8f0;
      cursor: pointer;
    }

    .cart-summary strong {
      color: #ffffff;
      font-weight: 700;
    }

    .wa-cta {
      background: linear-gradient(135deg, #15803d, #166534);
      border: 1px solid rgba(74, 222, 128, 0.35);
      color: #ffffff;
      border-radius: 999px;
      padding: 9px 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      cursor: pointer;
      font-family: inherit;
      text-align: left;
    }

    .wa-cta-text {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }

    .wa-cta-text span:first-child {
      font-size: 12.5px;
      font-weight: 700;
    }

    .wa-cta-text span:last-child {
      font-size: 11px;
      color: #dcfce7;
      opacity: 0.9;
    }

    /* MODAL DE PEDIDO Y UBICACIÓN */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(6px);
      z-index: 50;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-sheet {
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      background: #0d121d;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 24px 24px 0 0;
      padding: 20px 18px 28px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .modal-header h3 {
      font-size: 17px;
      font-weight: 700;
    }

    .close-modal {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #fff;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
    }

    .folio-tag {
      display: inline-block;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fbbf24;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .cart-items-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .cart-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 13.5px;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qty-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: transparent;
      color: #fff;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 5px;
    }

    .form-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 10px 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .form-input:focus {
      border-color: #f59e0b;
    }

    .gps-btn {
      width: 100%;
      background: rgba(37, 99, 235, 0.18);
      border: 1px solid rgba(59, 130, 246, 0.45);
      color: #93c5fd;
      padding: 10px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .gps-status {
      font-size: 11.5px;
      color: #4ade80;
      word-break: break-all;
    }

    .send-order-btn {
      width: 100%;
      background: #16a34a;
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 13px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    .secondary-wa-btn {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 14px;
      padding: 11px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- HEADER -->
    <header class="topbar">
      <div class="status-pill">
        <strong>📍 Zacatepec, Mor.</strong>
        <span class="status-dot">• Abierto hasta 1:00 am</span>
      </div>

      <div class="brand-logo">
        <img src="logo.png" alt="Taquería El Tizoncito" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
        <div class="brand-fallback" style="display:none;">EL TIZONCITO<br><small style="color:#fff;font-size:10px;">Zacatepec, Mor.</small></div>
      </div>

      <div class="header-actions">
        <button class="icon-btn" onclick="openCheckout()" aria-label="Ver carrito">
          🛒
          <span class="badge-count" id="topCartBadge">0</span>
        </button>
        <button class="icon-btn" onclick="openCheckout()" aria-label="Datos de entrega">
          👤
        </button>
      </div>
    </header>

    <!-- BANNER PROMOCIÓN DEL DÍA -->
    <section class="hero-promo" onclick="addPromoToCart()">
      <img src="promo.jpg" alt="Jueves de Pastor" onerror="this.src='https://images.unsplash.com/photo-1551504734-5ee1c4a1479b?auto=format&fit=crop&w=900&q=80'" />
      <div class="hero-content">
        <div class="hero-tag">PROMOCIÓN DEL DÍA</div>
        <h1 class="hero-title">Jueves de Pastor</h1>
        <p class="hero-sub">6 tacos x $60</p>
      </div>
    </section>

    <!-- CATEGORÍAS -->
    <nav class="categories-wrap" id="categoryTabs">
      <button class="cat-pill active" data-cat="Tacos">Tacos</button>
      <button class="cat-pill" data-cat="Especialidades">Especialidades</button>
      <button class="cat-pill" data-cat="Kilos">Kilos</button>
      <button class="cat-pill" data-cat="Postres">Postres</button>
      <button class="cat-pill" data-cat="Bebidas">Bebidas</button>
    </nav>

    <div class="section-divider"></div>

    <!-- CATÁLOGO 2 PRODUCTOS POR FILA -->
    <main class="products-grid" id="productsGrid"></main>
  </div>

  <!-- BARRA FLOTANTE INFERIOR -->
  <div class="bottom-bar-wrap">
    <div class="bottom-bar">
      <div class="cart-summary" onclick="openCheckout()">
        <strong>Pedido</strong> • <span id="barCount">0 artículos</span> • <strong id="barTotal">$0</strong>
      </div>
      <button class="wa-cta" onclick="openCheckout()">
        <span style="font-size:20px;">💬</span>
        <div class="wa-cta-text">
          <span>Pedir por WhatsApp</span>
          <span>734 132 58 27</span>
        </div>
      </button>
    </div>
  </div>

  <!-- MODAL DE CONFIRMACIÓN Y ENVÍO -->
  <div class="modal-backdrop" id="checkoutModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3>Tu Pedido a Domicilio</h3>
        <button class="close-modal" onclick="closeCheckout()">×</button>
      </div>

      <div class="folio-tag" id="folioPreview">Pedido #1000</div>

      <div class="cart-items-list" id="cartItemsList"></div>

      <div class="form-group">
        <label>Tu número de WhatsApp (10 dígitos)</label>
        <input type="tel" id="clientPhone" class="form-input" placeholder="Ej. 7341234567" maxlength="10" />
      </div>

      <div class="form-group">
        <label>Ubicación en Google Maps</label>
        <button type="button" class="gps-btn" onclick="captureGPS()">📍 Obtener mi ubicación actual (Google Maps)</button>
        <input type="text" id="mapsLink" class="form-input" placeholder="O pega aquí el enlace de Google Maps" />
        <div class="gps-status" id="gpsStatus"></div>
      </div>

      <div class="form-group">
        <label>Referencias del domicilio (calle, color de casa, entre calles)</label>
        <input type="text" id="addressRef" class="form-input" placeholder="Ej. Col. Lázaro Cárdenas, portón negro frente a la tienda" />
      </div>

      <button class="send-order-btn" onclick="sendOrder('taqueria')">
        Enviar Pedido a Taquería • <span id="modalTotal">$0</span>
      </button>

      <button class="secondary-wa-btn" onclick="sendOrder('cliente')">
        Enviar comprobante al WhatsApp del cliente
      </button>
    </div>
  </div>

  <script>
    // NÚMERO DE WHATSAPP DE LA TAQUERÍA
    const TAQUERIA_WA = "5217341325827";

    // CATÁLOGO POR CATEGORÍAS (Reemplaza las rutas img por tus archivos locales)
    const PRODUCTS = [
      {
        id: 1,
        name: "Orden de Pastor",
        price: 60,
        category: "Tacos",
        img: "orden-pastor.jpg",
        fallback: "https://images.unsplash.com/photo-1551504734-5ee1c4a1479b?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 2,
        name: "Paquete Familiar",
        price: 350,
        category: "Especialidades",
        img: "paquete-familiar.jpg",
        fallback: "https://images.unsplash.com/photo-1613514785940-daed07799d9b?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 3,
        name: "Kilo de Pastor",
        price: 350,
        category: "Kilos",
        img: "kilo-pastor.jpg",
        fallback: "https://images.unsplash.com/photo-1599974579688-8dbdd335c77f?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 4,
        name: "Gringas al Pastor",
        price: 45,
        category: "Especialidades",
        img: "gringas.jpg",
        fallback: "https://images.unsplash.com/photo-1618040996337-56904b7850b9?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 5,
        name: "Torta de Pastor",
        price: 55,
        category: "Especialidades",
        img: "torta-pastor.jpg",
        fallback: "https://images.unsplash.com/photo-1565299585323-38d6b0865b47?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 6,
        name: "Tacos de Bistec",
        price: 65,
        category: "Tacos",
        img: "tacos-bistec.jpg",
        fallback: "https://images.unsplash.com/photo-1552332386-f8dd00dc2f85?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 7,
        name: "1/2 Kilo de Pastor",
        price: 185,
        category: "Kilos",
        img: "medio-kilo.jpg",
        fallback: "https://images.unsplash.com/photo-1599974579688-8dbdd335c77f?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 8,
        name: "Rebanada de Pastel",
        price: 55,
        category: "Postres",
        img: "postre.jpg",
        fallback: "https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 9,
        name: "Refresco 600 ml",
        price: 25,
        category: "Bebidas",
        img: "refresco.jpg",
        fallback: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 10,
        name: "Refresco 2 Litros",
        price: 45,
        category: "Bebidas",
        img: "refresco-2l.jpg",
        fallback: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?auto=format&fit=crop&w=600&q=80"
      }
    ];

    let activeCategory = "Tacos";
    let cart = [];

    // CONTADOR ASCENDENTE DESDE 1000
    function getCurrentFolio() {
      const saved = parseInt(localStorage.getItem("tizoncito_folio") || "1000", 10);
      return isNaN(saved) || saved < 1000 ? 1000 : saved;
    }

    function incrementFolio() {
      const next = getCurrentFolio() + 1;
      localStorage.setItem("tizoncito_folio", String(next));
      return next;
    }

    // RENDERIZADO DE PRODUCTOS POR CATEGORÍA
    function renderProducts() {
      const grid = document.getElementById("productsGrid");
      const filtered = PRODUCTS.filter(p => p.category === activeCategory);

      grid.innerHTML = filtered.map(item => `
        <article class="product-card" onclick="addToCart(${item.id})">
          <img src="${item.img}" alt="${item.name}" onerror="this.src='${item.fallback}'" />
          <div class="card-overlay">
            <div class="card-info">
              <div class="card-title">${item.name}</div>
              <div class="card-price">$${item.price}</div>
            </div>
            <button class="add-btn" type="button" onclick="event.stopPropagation(); addToCart(${item.id})">+</button>
          </div>
        </article>
      `).join("");
    }

    // EVENTOS DE PESTAÑAS DE CATEGORÍA
    document.querySelectorAll(".cat-pill").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".cat-pill").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeCategory = btn.dataset.cat;
        renderProducts();
      });
    });

    function addToCart(id) {
      const product = PRODUCTS.find(p => p.id === id);
      if (!product) return;
      const existing = cart.find(c => c.id === id);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ ...product, qty: 1 });
      }
      updateCartUI();
    }

    function addPromoToCart() {
      addToCart(1);
    }

    function changeQty(id, delta) {
      const index = cart.findIndex(c => c.id === id);
      if (index === -1) return;
      cart[index].qty += delta;
      if (cart[index].qty <= 0) {
        cart.splice(index, 1);
      }
      updateCartUI();
      renderModalCart();
    }

    function updateCartUI() {
      const totalItems = cart.reduce((acc, item) => acc + item.qty, 0);
      const totalPrice = cart.reduce((acc, item) => acc + item.price * item.qty, 0);

      document.getElementById("topCartBadge").textContent = totalItems;
      document.getElementById("barCount").textContent = `${totalItems} ${totalItems === 1 ? "artículo" : "artículos"}`;
      document.getElementById("barTotal").textContent = `$${totalPrice}`;
      document.getElementById("modalTotal").textContent = `$${totalPrice}`;
    }

    function renderModalCart() {
      const list = document.getElementById("cartItemsList");
      if (cart.length === 0) {
        list.innerHTML = `<p style="color:#94a3b8;font-size:13px;">Aún no agregas platillos a tu pedido.</p>`;
        return;
      }
      list.innerHTML = cart.map(item => `
        <div class="cart-item-row">
          <div>
            <strong>${item.name}</strong><br>
            <small style="color:#94a3b8;">$${item.price} c/u</small>
          </div>
          <div class="qty-controls">
            <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
            <span>${item.qty}</span>
            <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
          </div>
        </div>
      `).join("");
    }

    function openCheckout() {
      document.getElementById("folioPreview").textContent = `Pedido #${getCurrentFolio()}`;
      // Cargar datos recordados del cliente si ya pidió antes
      document.getElementById("clientPhone").value = localStorage.getItem("tz_phone") || "";
      document.getElementById("mapsLink").value = localStorage.getItem("tz_maps") || "";
      document.getElementById("addressRef").value = localStorage.getItem("tz_ref") || "";
      renderModalCart();
      document.getElementById("checkoutModal").classList.add("open");
    }

    function closeCheckout() {
      document.getElementById("checkoutModal").classList.remove("open");
    }

    // OBTENER UBICACIÓN EN GOOGLE MAPS
    function captureGPS() {
      const status = document.getElementById("gpsStatus");
      if (!navigator.geolocation) {
        status.textContent = "Tu navegador no soporta GPS. Pega el enlace manualmente.";
        return;
      }
      status.textContent = "Obteniendo ubicación exacta...";
      navigator.geolocation.getCurrentPosition(
        pos => {
          const { latitude, longitude } = pos.coords;
          const url = `https://maps.google.com/?q=${latitude},${longitude}`;
          document.getElementById("mapsLink").value = url;
          status.textContent = "✓ Ubicación lista para Google Maps";
        },
        () => {
          status.style.color = "#f87171";
          status.textContent = "No se pudo obtener GPS. Activa la ubicación o pega el enlace.";
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    // ARMAR Y ENVIAR PEDIDO POR WHATSAPP
    function sendOrder(target) {
      if (cart.length === 0) {
        alert("Agrega al menos un platillo antes de pedir.");
        return;
      }

      const phone = document.getElementById("clientPhone").value.replace(/\D/g, "");
      const maps = document.getElementById("mapsLink").value.trim();
      const ref = document.getElementById("addressRef").value.trim();

      if (phone.length < 10) {
        alert("Por favor ingresa tu número de WhatsApp a 10 dígitos.");
        return;
      }
      if (!ref && !maps) {
        alert("Por favor agrega tu ubicación de Google Maps o una referencia del domicilio.");
        return;
      }

      // Guardar datos localmente para futuros pedidos sin cuenta
      localStorage.setItem("tz_phone", phone);
      localStorage.setItem("tz_maps", maps);
      localStorage.setItem("tz_ref", ref);

      const folio = getCurrentFolio();
      const total = cart.reduce((acc, item) => acc + item.price * item.qty, 0);
      const itemsText = cart.map(item => `• ${item.qty}x ${item.name} ($${item.price * item.qty})`).join("\n");

      const message =
        `🔥 *NUEVO PEDIDO #${folio}*\n` +
        `*Taquería El Tizoncito - Zacatepec*\n\n` +
        `*Detalle del pedido:*\n${itemsText}\n\n` +
        `💰 *Total:* $${total} MXN\n` +
        `📱 *WhatsApp Cliente:* ${phone}\n` +
        `📍 *Ubicación Google Maps:* ${maps || "No adjuntada"}\n` +
        `🏠 *Referencia:* ${ref || "Sin referencia adicional"}`;

      // Incrementar folio para el siguiente pedido
      incrementFolio();

      const destinationNumber = target === "cliente" ? `521${phone}` : TAQUERIA_WA;
      const waUrl = `https://wa.me/${destinationNumber}?text=${encodeURIComponent(message)}`;
      window.open(waUrl, "_blank");
    }

    // Inicializar vista
    renderProducts();
    updateCartUI();
  </script>
</body>
</html>
